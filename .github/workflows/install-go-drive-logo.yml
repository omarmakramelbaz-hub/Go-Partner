name: Install HD GO Partner Logo

on:
  push:
    branches: [ "main" ]
    paths:
      - 'tool/go_drive_logo_hd_chunks/**'
      - '.github/workflows/install-go-partner-logo.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Rebuild and wire HD GO Partner logo
        shell: bash
        run: |
          set -euo pipefail
          cat tool/go_drive_logo_hd_chunks/0{1..7}.b64 | tr -d '\n\r' > /tmp/go_drive_logo.b64
          base64 -d /tmp/go_drive_logo.b64 > assets/images/go_drive_logo_hd.webp
          test -s assets/images/go_drive_logo_hd.webp
          file assets/images/go_drive_logo_hd.webp | grep -qi 'webp'
          test "$(stat -c%s assets/images/go_drive_logo_hd.webp)" -eq 67002

          python3 - <<'PY'
          from pathlib import Path

          files = [
              Path('lib/view/layout/auth/screen/login_screen.dart'),
              Path('lib/view/layout/auth/screen/regester_screen.dart'),
          ]
          old_paths = [
              'assets/images/delegate_login_fisher_logo.jpg',
              'assets/images/go_drive_brand_v4.jpg',
              'assets/images/go_drive_brand_v5.webp',
              'assets/images/go_drive_brand_hd.webp',
          ]

          for path in files:
              text = path.read_text(encoding='utf-8')
              for old in old_paths:
                  text = text.replace(old, 'assets/images/go_drive_logo_hd.webp')
              logo_pos = text.find('assets/images/go_drive_logo_hd.webp')
              if logo_pos < 0:
                  raise SystemExit(f'HD logo reference missing in {path}')
              before = text[:logo_pos]
              after = text[logo_pos:]
              clip_pos = before.rfind('ClipOval(')
              if clip_pos >= 0 and logo_pos - clip_pos < 250:
                  before = before[:clip_pos] + 'SizedBox(' + before[clip_pos + len('ClipOval('):]
              cover_pos = after.find('fit: BoxFit.cover')
              if cover_pos >= 0 and cover_pos < 250:
                  after = after[:cover_pos] + 'fit: BoxFit.contain' + after[cover_pos + len('fit: BoxFit.cover'):]
              text = before + after
              path.write_text(text, encoding='utf-8')
          PY

      - name: Verify auth logo layout
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'assets/images/go_drive_logo_hd.webp' lib/view/layout/auth/screen/login_screen.dart
          grep -q 'assets/images/go_drive_logo_hd.webp' lib/view/layout/auth/screen/regester_screen.dart
          grep -q 'fit: BoxFit.contain' lib/view/layout/auth/screen/login_screen.dart
          grep -q 'fit: BoxFit.contain' lib/view/layout/auth/screen/regester_screen.dart

      - name: Commit HD logo and auth references
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/images/go_drive_logo_hd.webp lib/view/layout/auth/screen/login_screen.dart lib/view/layout/auth/screen/regester_screen.dart
          if git diff --cached --quiet; then
            echo "HD logo already installed"
            exit 0
          fi
          git commit -m "Show HD GO Partner logo without crop"
          git push
