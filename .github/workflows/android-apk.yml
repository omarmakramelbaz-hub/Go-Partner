name: Build GO Partner Android Release

on:
  push:
    branches: ["main"]
    paths:
      - "pubspec.yaml"
      - "lib/**"
      - "assets/**"
      - "android/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

jobs:
  build_android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true

      - name: Verify GO Partner launcher assets
        shell: bash
        run: |
          set -euo pipefail
          test -s assets/images/go_partner_app_icon.png
          test -s android/app/src/main/res/mipmap-mdpi/ic_launcher.png
          test -s android/app/src/main/res/mipmap-hdpi/ic_launcher.png
          test -s android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
          test -s android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          test -s android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

      - name: Patch Android build compatibility
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          settings = Path('android/settings.gradle')
          s = settings.read_text(encoding='utf-8')
          s = s.replace('id "com.android.application" version "8.7.0" apply false',
                        'id "com.android.application" version "8.9.1" apply false')
          s = s.replace('id "org.jetbrains.kotlin.android" version "1.8.22" apply false',
                        'id "org.jetbrains.kotlin.android" version "2.3.0" apply false')
          settings.write_text(s, encoding='utf-8')

          wrapper = Path('android/gradle/wrapper/gradle-wrapper.properties')
          w = wrapper.read_text(encoding='utf-8')
          w = w.replace('gradle-8.10.2-all.zip', 'gradle-8.14.3-all.zip')
          wrapper.write_text(w, encoding='utf-8')

          app = Path('android/app/build.gradle')
          a = app.read_text(encoding='utf-8')
          a = a.replace('compileSdk = 35', 'compileSdk = 36')
          a = a.replace('targetSdk = 35', 'targetSdk = 36')
          a = a.replace('buildToolsVersion "23.0.1"\n', '')
          a = a.replace('ndkVersion "27.0.12077973"', 'ndkVersion "28.2.13676358"')
          app.write_text(a, encoding='utf-8')
          PY
          grep -q 'version "8.9.1"' android/settings.gradle
          grep -q 'version "2.3.0"' android/settings.gradle
          grep -q 'gradle-8.14.3-all.zip' android/gradle/wrapper/gradle-wrapper.properties
          grep -q 'compileSdk = 36' android/app/build.gradle
          grep -q 'targetSdk = 36' android/app/build.gradle
          grep -q '28.2.13676358' android/app/build.gradle

      - name: Install Dependencies
        run: flutter pub get

      - name: Verify mobile version
        run: |
          grep -q '^version: 1.0.24+25$' pubspec.yaml
          grep -q 'android:label="GO Partner"' android/app/src/main/AndroidManifest.xml

      - name: Build Release APK
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Build Release AAB
        run: flutter build appbundle --release --android-skip-build-dependency-validation

      - name: Verify Android artifacts
        shell: bash
        run: |
          set -euo pipefail
          test -s build/app/outputs/flutter-apk/app-release.apk
          test -s build/app/outputs/bundle/release/app-release.aab
          ls -lh build/app/outputs/flutter-apk/app-release.apk
          ls -lh build/app/outputs/bundle/release/app-release.aab
          sha256sum build/app/outputs/flutter-apk/app-release.apk
          sha256sum build/app/outputs/bundle/release/app-release.aab

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: go-partner-1.0.24-build25-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: go-partner-1.0.24-build25-aab
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
