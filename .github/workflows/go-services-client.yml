name: GO service client checks
on:
  push:
    branches: [feat/go-service-marketplace-20260926]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: go-service-client-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Analyze new client code
        run: flutter analyze --no-fatal-infos --no-fatal-warnings lib/go_services test/go_services_test.dart
      - name: Run contract and widget checks
        run: flutter test test/go_services_test.dart
      - name: Compile without deploying
        run: flutter build web --release --no-web-resources-cdn
