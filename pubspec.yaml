name: go_partner
description: "GO Partner — partner, courier and professional service app."
publish_to: 'none'

version: 1.0.23+24

environment:
  sdk: ^3.9.2
#  sdk: '>=3.4.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.6
  timeago: ^3.7.0
  provider: ^6.1.2
  hive_flutter: ^1.1.0
  easy_localization: ^3.0.7
  country_picker: ^2.0.26
  bot_toast: ^4.1.3
  custom_timer: ^0.2.3
  gap: ^3.0.1
  # animate_do: ^3.3.4
  flutter_svg: ^2.0.10+1
  pinput: ^5.0.0
  cached_network_image: ^3.3.1
  loading_animation_widget: ^1.2.1
  shimmer_animation: ^2.2.1
  
  carousel_slider: ^5.0.0
  smooth_page_indicator: ^1.2.0+3
  photo_view: ^0.15.0
  image_picker: ^1.1.2
  dio: ^5.5.0+1
  http: ^1.2.2
  http_parser: ^4.0.2
  mime: ^2.0.0
  path: ^1.9.0
  path_provider: ^2.1.3
  pretty_dio_logger: ^1.4.0
  connectivity_plus: ^6.0.3
  url_launcher: ^6.3.0
  intl: ^0.20.2
  hive: ^2.2.3
  flutter_svg_provider: ^1.0.7
  # easy_rich_text: ^1.2.1
  flutter_widget_from_html: ^0.15.1
  fl_chart: ^0.70.2
  geolocator: ^13.0.1
  geocoding: ^3.0.0
  maplibre_gl: ^0.27.0
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  flutter_local_notifications: ^18.0.1
  firebase_messaging: ^15.2.0
  firebase_core: ^3.10.0
  cloud_firestore: ^5.6.1
  googleapis: ^13.1.0
  googleapis_auth: ^1.6.0
  collection: ^1.18.0
  uuid: ^4.5.0
  grouped_list: ^6.0.0
  webview_flutter: ^4.8.0
  webview_flutter_android: ^4.3.1
  webview_flutter_wkwebview: ^3.14.0
  audioplayers: ^6.1.0
#  volume_controller: ^2.0.7
  flutter_polyline_points: ^2.0.0
  location: ^7.0.0
  # defer_pointer: ^0.0.2
  # timeline_tile: ^2.0.0
#  change_app_package_name: ^1.4.0
  pusher_channels_flutter: ^2.4.0


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

  
flutter:
  uses-material-design: true
  assets:
    - i18n/
    - assets/images/
    - assets/svg/
    - assets/global_icon/
    - assets/
    - assets/sound/
    - assets/map_styles/
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/font/Roboto/Roboto-Regular.ttf
          weight: 400
        - asset: assets/font/Roboto/Roboto-Medium.ttf
          weight: 500
        - asset: assets/font/Roboto/Roboto-Bold.ttf
          weight: 700
        - asset: assets/font/Roboto/Roboto-Black.ttf
          weight: 900
    - family: Tajawal
      fonts:
        - asset: assets/font/Tajawal/Tajawal-Regular.ttf
          weight: 400
        - asset: assets/font/Tajawal/Tajawal-Medium.ttf
          weight: 500
        - asset: assets/font/Tajawal/Tajawal-Bold.ttf
          weight: 700
        - asset: assets/font/Tajawal/Tajawal-Black.ttf
          weight: 900    


flutter_native_splash:
  color: "#FFFFFF"
  image: assets/images/go_drive_splash_native.png
  android: true
  ios: true
  web: false
  android_12:
    color: "#FFFFFF"
    image: assets/images/go_drive_splash_native.png
    icon_background_color: "#FFFFFF"

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/go_drive_app_icon.png
  min_sdk_android: 21
  remove_alpha_ios: true
  web:
    generate: true
    image_path: assets/images/go_drive_app_icon.png
    background_color: "#FFFFFF"
    theme_color: "#FD7201"
